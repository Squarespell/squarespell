# Squarespell Quiz - Hostinger STAGING stack (PR #63 branch). Staging only; not for production.
# Run through infra/hostinger/scripts/deploy.sh. Values come from the protected server-side
# env file /srv/squarespell-quiz/staging/.env (owner-only, never committed).
# Architecture mirrors the repository: Next.js frontend, Express API, Supabase-style REST layer
# (PostgREST on a private PostgreSQL container), and HTTP cron endpoints (/api/cron/*).
name: squarespell-quiz-staging

x-restart: &restart
  restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

services:
  proxy:
    <<: *restart
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAGING_APP_HOST: ${STAGING_APP_HOST:?set STAGING_APP_HOST}
      STAGING_API_HOST: ${STAGING_API_HOST:?set STAGING_API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    <<: *restart
    build:
      context: ../..
      dockerfile: infra/hostinger/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://${STAGING_API_HOST}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      NODE_ENV: production
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      # One-button connect feature flag (off unless set to true in the staging env file; not passed to production).
      CONNECT_ENABLED: ${CONNECT_ENABLED:-}
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    <<: *restart
    build:
      context: ../..
      dockerfile: infra/hostinger/Dockerfile.backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      SUPABASE_URL: http://gateway:3100
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CORE_PRICE_ID: ${STRIPE_CORE_PRICE_ID:-}
      STRIPE_CORE_YEARLY_PRICE_ID: ${STRIPE_CORE_YEARLY_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      STRIPE_BUSINESS_YEARLY_PRICE_ID: ${STRIPE_BUSINESS_YEARLY_PRICE_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PLATFORM_EMAIL_FROM: ${PLATFORM_EMAIL_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      REPORT_SECRET: ${REPORT_SECRET:?set REPORT_SECRET}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      PEXELS_ACCESS_KEY: ${PEXELS_ACCESS_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      FRONTEND_URL: https://${STAGING_APP_HOST}
      APP_URL: https://${STAGING_APP_HOST}
      MARKETING_URL: https://${STAGING_APP_HOST}
      BACKEND_URL: https://${STAGING_API_HOST}
      CORS_ORIGINS: https://${STAGING_APP_HOST}
      CORS_ORIGIN: https://${STAGING_APP_HOST}
      # The 'worker' service drains the email queue; do not also run the in-process timer.
      DISABLE_INPROCESS_EMAIL_QUEUE: "true"
      # One-button connect (staging review only). CONNECT_TEST_FAULTS also enables the staging fixture website and failure simulation.
      CONNECT_ENABLED: ${CONNECT_ENABLED:-}
      CONNECT_TEST_FAULTS: ${CONNECT_TEST_FAULTS:-}
      CONNECT_MAX_SITES: ${CONNECT_MAX_SITES:-}
      CONNECT_MAX_INSTALLATIONS_PER_SITE: ${CONNECT_MAX_INSTALLATIONS_PER_SITE:-}
    depends_on:
      gateway:
        condition: service_started
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # The repository has no separate queue-worker process. Its "worker" duty is draining the email
  # queue over HTTP (POST /api/cron/process-email-queue); the scheduler runs the render.yaml crons.
  worker:
    <<: *restart
    image: curlimages/curl:8.8.0
    entrypoint: ["/bin/sh", "/opt/scheduler.sh", "worker"]
    environment:
      API_URL: http://backend:3001
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      ENABLE_EMAIL_JOBS: ${SCHEDULER_ENABLE_EMAIL_JOBS:-false}
    volumes:
      - ./scheduler/scheduler.sh:/opt/scheduler.sh:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/scheduler.sh", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  scheduler:
    <<: *restart
    image: curlimages/curl:8.8.0
    entrypoint: ["/bin/sh", "/opt/scheduler.sh", "scheduler"]
    environment:
      API_URL: http://backend:3001
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      ENABLE_EMAIL_JOBS: ${SCHEDULER_ENABLE_EMAIL_JOBS:-false}
    volumes:
      - ./scheduler/scheduler.sh:/opt/scheduler.sh:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/scheduler.sh", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Supabase-style REST layer for the API (supabase-js speaks PostgREST). Private: internal network only.
  gateway:
    <<: *restart
    image: caddy:2.8
    volumes:
      - ./Caddyfile.rest:/etc/caddy/Caddyfile:ro
    depends_on:
      - rest
    networks: [internal]

  rest:
    <<: *restart
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?set AUTHENTICATOR_PASSWORD}@db:5432/quiz_staging
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?set PGRST_JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: quiz_staging
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quiz_staging"]
      interval: 10s
      timeout: 5s
      retries: 12
