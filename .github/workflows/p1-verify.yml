# Phase 1 cloud verification for draft PR #63.
# Runs only in GitHub-hosted runners. Uses fake, generated-at-run-time credentials only.
# No production secrets, no calls to production services, no scheduled jobs, no deployments.
name: P1 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - tests, type-check, production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Backend tests (vitest)
        run: npx vitest run
      - name: Backend type-check
        run: npx tsc --noEmit
      - name: Backend production build
        run: npm run build

  frontend:
    name: Frontend - tests, type-check, production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_local_fixture
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Frontend tests (vitest)
        run: npx vitest run
      - name: Frontend type-check
        run: npx tsc --noEmit
      - name: Frontend production build
        run: npm run build

  database-and-api:
    name: Migrations from empty database, migration 031, API and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Prepare helpers (temporary PostgreSQL, Supabase shim, migration functions)
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql --version
          cat > "$RUNNER_TEMP/prelude.sql" <<'EOF'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql AS $$ SELECT 'service_role'::text $$;
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role; END IF;
          END $$;
          EOF
          git show origin/main:backend/migrations/016_enable_rls.sql > "$RUNNER_TEMP/016_original.sql"
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          export LC_ALL=C
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=ci_only_password
          W="$GITHUB_WORKSPACE"; T="$RUNNER_TEMP"
          newdb() {
            psql -q -v ON_ERROR_STOP=1 -d postgres -c "DROP DATABASE IF EXISTS $1" -c "CREATE DATABASE $1"
            psql -q -v ON_ERROR_STOP=1 -d "$1" -f "$T/prelude.sql"
          }
          strict() { psql -q -v ON_ERROR_STOP=1 -d "$1" -f "$2" > /dev/null; }
          apply_base() { echo "applying SUPABASE_SCHEMA.sql"; strict "$1" "$W/SUPABASE_SCHEMA.sql"; }
          apply_tail() { echo "applying 20260415_email_automation.sql"; strict "$1" "$W/backend/src/db/migrations/20260415_email_automation.sql"; }
          # apply_migs DB [corrected|orig-strict|orig-tolerant] [STOP_BEFORE_FILENAME]
          apply_migs() {
            local db="$1" mode="$2" stop="$3" f b src
            [ -n "$mode" ] || mode=corrected
            for f in $(ls "$W"/backend/migrations/*.sql | sort); do
              b=$(basename "$f")
              if [ -n "$stop" ] && [ "$b" = "$stop" ]; then echo "stopping before $b"; return 0; fi
              src="$f"
              if [ "$b" = "016_enable_rls.sql" ] && [ "$mode" != corrected ]; then src="$T/016_original.sql"; fi
              echo "applying $b"
              if [ "$b" = "016_enable_rls.sql" ] && [ "$mode" = orig-tolerant ]; then
                psql -q -d "$db" -f "$src" > /dev/null 2> "$T/016_tolerant_errors.txt" || true
              else
                strict "$db" "$src" || { echo "::error::migration $b failed"; return 1; }
              fi
            done
          }
          inventory() {
            psql -d "$1" -At -F '|' \
              -c "select 'col',table_name,column_name,data_type,is_nullable,coalesce(column_default,'') from information_schema.columns where table_schema='public'" \
              -c "select 'con',conrelid::regclass::text,conname,pg_get_constraintdef(oid) from pg_constraint where connamespace='public'::regnamespace" \
              -c "select 'idx',tablename,indexname,indexdef from pg_indexes where schemaname='public'" \
              -c "select 'pol',tablename,policyname,cmd,coalesce(qual,''),coalesce(with_check,'') from pg_policies where schemaname='public'" \
              -c "select 'fn',p.proname,pg_get_function_identity_arguments(p.oid) from pg_proc p where p.pronamespace='public'::regnamespace" \
              -c "select 'rls',relname,relrowsecurity::text from pg_class where relnamespace='public'::regnamespace and relkind='r'" | tr -d '\r' | sort
          }
          rowcounts() {
            psql -d "$1" -At -c "select table_name||'='||(xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1" | sort
          }
          EOF
          cmp -s "$RUNNER_TEMP/016_original.sql" backend/migrations/016_enable_rls.sql && echo "::warning::migration 016 is identical to main (no modification present)" || echo "migration 016 differs from main (expected: Phase 1 correction)"

      - name: Migration 031 is forward-only (static guard)
        run: |
          f=backend/migrations/031_schema_reconciliation.sql
          bad=$(grep -nE '^[^-]*\b(DELETE[[:space:]]+FROM|UPDATE[[:space:]]+[A-Za-z_]+[[:space:]]+SET|TRUNCATE|DROP[[:space:]]+TABLE|DROP[[:space:]]+COLUMN|DROP[[:space:]]+SCHEMA|RENAME[[:space:]]+(TO|COLUMN)|ALTER[[:space:]]+COLUMN[[:space:]]+[A-Za-z_]+[[:space:]]+(SET[[:space:]]+DATA[[:space:]]+)?TYPE)\b' "$f" || true)
          if [ -n "$bad" ]; then echo "::error::031 contains a data-destroying or type-changing statement"; echo "$bad"; exit 1; fi
          drops=$(grep -nE '^[^-]*\bDROP\b' "$f" | grep -vE 'DROP CONSTRAINT IF EXISTS email_sequence_queue_status_check|DROP FUNCTION IF EXISTS insert_lead_with_limit_check|DROP NOT NULL' || true)
          if [ -n "$drops" ]; then echo "::error::031 contains an unexpected DROP"; echo "$drops"; exit 1; fi
          echo "031 contains no DELETE/UPDATE/TRUNCATE/DROP TABLE/DROP COLUMN/RENAME/TYPE change, and only three allow-listed DROPs."

      - name: Complete migration chain from an empty database (corrected 016), including 031
        run: |
          source "$RUNNER_TEMP/lib.sh"
          newdb fresh
          apply_base fresh
          apply_migs fresh corrected
          apply_tail fresh
          inventory fresh > "$T/inv_fresh.txt"
          echo "fresh database: $(psql -d fresh -At -c "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'") tables, $(grep -c '^pol|' "$T/inv_fresh.txt") policy lines"
          psql -d fresh -At -c "select 'stripe_webhook_events exists', to_regclass('public.stripe_webhook_events') is not null" -c "select 'insert_lead_with_limit_check has 11 args', pronargs=11 from pg_proc where proname='insert_lead_with_limit_check'"

      - name: Original migration 016 stops a fresh database (proof that the correction is required)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          newdb orig016
          apply_base orig016
          set +e
          apply_migs orig016 orig-strict > "$T/orig_out.txt" 2> "$T/orig_err.txt"
          rc=$?
          set -e
          cat "$T/orig_out.txt" | tail -5
          cat "$T/orig_err.txt" | head -12
          [ "$rc" -ne 0 ] || { echo "::error::expected the ORIGINAL 016 to fail on a fresh database, but the chain completed"; exit 1; }
          grep -q "operator does not exist: text = uuid" "$T/orig_err.txt" || { echo "::error::original 016 failed, but not with the expected text = uuid error"; exit 1; }
          ! grep -q "applying 017_database_cleanup.sql" "$T/orig_out.txt" || { echo "::error::chain continued past the failing 016"; exit 1; }
          echo "CONFIRMED: with the original 016 the chain halts at 016 and migrations 017-031 are never reached."

      - name: Migration 031 upgrade path - additive only, idempotent, no data change
        run: |
          source "$RUNNER_TEMP/lib.sh"
          newdb upgrade
          apply_base upgrade
          apply_migs upgrade corrected 031_schema_reconciliation.sql
          psql -q -v ON_ERROR_STOP=1 -d upgrade -c "insert into users (clerk_user_id, email, plan, quiz_count) values ('user_ci_seed', 'seed@example.test', 'free', 0)"
          seed_hash() { psql -d upgrade -At -c "select md5(string_agg(concat_ws('|', id, clerk_user_id, email, plan, quiz_count), ';' order by id)) from users"; }
          h1=$(seed_hash)
          inventory upgrade > "$T/inv_before.txt"
          rowcounts upgrade > "$T/rc_before.txt"
          echo "applying 031 (first run)"
          strict upgrade "$W/backend/migrations/031_schema_reconciliation.sql"
          inventory upgrade > "$T/inv_after.txt"
          rowcounts upgrade > "$T/rc_after.txt"
          echo "applying 031 (second run, must be a no-op)"
          strict upgrade "$W/backend/migrations/031_schema_reconciliation.sql"
          inventory upgrade > "$T/inv_after2.txt"
          cmp "$T/inv_after.txt" "$T/inv_after2.txt" || { echo "::error::031 is not idempotent"; exit 1; }
          echo "--- objects removed or changed by 031 (allow-list: replaced check constraint, outcome_id nullability, replaced function signature)"
          comm -23 "$T/inv_before.txt" "$T/inv_after.txt" | tee "$T/removed.txt"
          unexpected=$(grep -vE '^(con\|email_sequence_queue\|email_sequence_queue_status_check\||col\|email_sequences\|outcome_id\||fn\|insert_lead_with_limit_check\|)' "$T/removed.txt" || true)
          if [ -n "$unexpected" ]; then echo "::error::031 removed or changed objects outside the allow-list"; echo "$unexpected"; exit 1; fi
          echo "--- objects added by 031: $(comm -13 "$T/inv_before.txt" "$T/inv_after.txt" | wc -l) lines"
          changed=$(comm -23 "$T/rc_before.txt" "$T/rc_after.txt" || true)
          if [ -n "$changed" ]; then echo "::error::031 changed a table row count"; echo "$changed"; exit 1; fi
          [ "$(seed_hash)" = "$h1" ] || { echo "::error::031 changed a pre-existing users row"; exit 1; }
          echo "031: additive, idempotent, no row counts or seeded rows changed."
          apply_tail upgrade
          inventory upgrade > "$T/inv_upgrade_final.txt"
          diff "$T/inv_fresh.txt" "$T/inv_upgrade_final.txt" && echo "IDENTICAL: schema, constraints, indexes, policies and functions of (chain to 030 + 031) equal the fresh full chain."

      - name: Informational - database built with the original 016 then upgraded with 031 (policy divergence, not a failure)
        continue-on-error: true
        run: |
          source "$RUNNER_TEMP/lib.sh"
          newdb legacy
          apply_base legacy
          apply_migs legacy orig-tolerant
          apply_tail legacy
          echo "errors ignored while applying the original 016 tolerantly:"; cat "$T/016_tolerant_errors.txt" | head -12
          inventory legacy > "$T/inv_legacy.txt"
          echo "--- differences between a legacy-built database and the fresh chain (expected: only the repository policies that the original 016 could not create)"
          diff "$T/inv_fresh.txt" "$T/inv_legacy.txt" || true

      - name: Install and build the API
        run: |
          cd backend
          npm ci
          npm run build

      - name: Start temporary REST layer (PostgREST) and Supabase-style proxy on the temporary database
        run: |
          source "$RUNNER_TEMP/lib.sh"
          psql -q -v ON_ERROR_STOP=1 -d fresh <<'EOF'
          CREATE ROLE authenticator LOGIN NOINHERIT PASSWORD 'ci_only_password';
          GRANT anon, authenticated, service_role TO authenticator;
          ALTER ROLE service_role BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role;
          GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO service_role;
          GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO service_role;
          EOF
          node - <<'EOF'
          const crypto = require('crypto'), fs = require('fs');
          const tmp = process.env.RUNNER_TEMP;
          const kp = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 });
          fs.writeFileSync(tmp + '/clerk_public.pem', kp.publicKey.export({ type: 'spki', format: 'pem' }));
          const b = (x) => Buffer.from(x).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const data = b(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid: 'ins_ci_local' })) + '.' + b(JSON.stringify({ sub: 'user_ci_smoke', iss: 'https://clerk.ci.local', iat: now - 5, nbf: now - 10, exp: now + 1800, sid: 'sess_ci' }));
          fs.writeFileSync(tmp + '/smoke_token.txt', data + '.' + b(crypto.sign('RSA-SHA256', Buffer.from(data), kp.privateKey)));
          const secret = crypto.randomBytes(32).toString('hex');
          fs.writeFileSync(tmp + '/pgrst_secret.txt', secret);
          const h = b(JSON.stringify({ alg: 'HS256', typ: 'JWT' })) + '.' + b(JSON.stringify({ role: 'service_role', iss: 'ci-local', iat: now, exp: now + 7200 }));
          fs.writeFileSync(tmp + '/service_role.txt', h + '.' + crypto.createHmac('sha256', secret).update(h).digest('base64url'));
          EOF
          echo "::add-mask::$(cat "$RUNNER_TEMP/smoke_token.txt")"
          echo "::add-mask::$(cat "$RUNNER_TEMP/service_role.txt")"
          echo "::add-mask::$(cat "$RUNNER_TEMP/pgrst_secret.txt")"
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://authenticator:ci_only_password@127.0.0.1:5432/fresh" \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$(cat "$RUNNER_TEMP/pgrst_secret.txt")" \
            -e PGRST_SERVER_PORT=3000 postgrest/postgrest:v12.2.3
          cat > "$RUNNER_TEMP/proxy.js" <<'EOF'
          const http = require('http');
          http.createServer((req, res) => {
            const path = req.url.replace(/^\/rest\/v1/, '') || '/';
            const up = http.request({ host: '127.0.0.1', port: 3000, path, method: req.method, headers: req.headers }, (r) => { res.writeHead(r.statusCode, r.headers); r.pipe(res); });
            up.on('error', (e) => { res.writeHead(502); res.end(String(e)); });
            req.pipe(up);
          }).listen(3100, '127.0.0.1');
          EOF
          nohup node "$RUNNER_TEMP/proxy.js" > "$RUNNER_TEMP/proxy.log" 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3100/rest/v1/ > /dev/null
          echo "PostgREST and proxy are up on the temporary database."

      - name: Start the API with safe test configuration, check health and readiness
        run: |
          source "$RUNNER_TEMP/lib.sh"
          psql -q -v ON_ERROR_STOP=1 -d fresh -c "insert into users (clerk_user_id, email, plan, quiz_count) values ('user_ci_smoke', 'ci-smoke@example.test', 'pro', 0)"
          cd backend
          export NODE_ENV=production PORT=3001
          export SUPABASE_URL=http://127.0.0.1:3100
          export SUPABASE_SERVICE_ROLE_KEY="$(cat "$RUNNER_TEMP/service_role.txt")"
          export CLERK_SECRET_KEY=sk_test_ci_local_fixture
          export CLERK_JWT_KEY="$(cat "$RUNNER_TEMP/clerk_public.pem")"
          export CLERK_API_URL=http://127.0.0.1:9
          export CLERK_WEBHOOK_SECRET=whsec_Y2lfbG9jYWxfZml4dHVyZV9jbGVya19zZWNyZXQ=
          export STRIPE_SECRET_KEY=sk_test_ci_local_fixture
          export STRIPE_WEBHOOK_SECRET=whsec_ci_local_fixture_stripe_secret
          export RESEND_API_KEY=re_ci_local_fixture
          export RESEND_BASE_URL=http://127.0.0.1:9
          export RESEND_WEBHOOK_SECRET=whsec_Y2lfbG9jYWxfZml4dHVyZV9yZXNlbmRfc2VjcmV0
          export ANTHROPIC_API_KEY=sk-ant-ci-local-fixture
          export ANTHROPIC_BASE_URL=http://127.0.0.1:9
          export ENCRYPTION_KEY="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          export REPORT_SECRET=ci-local-report-secret CRON_SECRET=ci-local-cron-secret
          export FRONTEND_URL=http://127.0.0.1:3000 APP_URL=http://127.0.0.1:3000 BACKEND_URL=http://127.0.0.1:3001
          export STRIPE_CORE_PRICE_ID=price_ci_core_m STRIPE_CORE_YEARLY_PRICE_ID=price_ci_core_y STRIPE_PRO_PRICE_ID=price_ci_pro_m STRIPE_PRO_YEARLY_PRICE_ID=price_ci_pro_y STRIPE_BUSINESS_PRICE_ID=price_ci_biz_m STRIPE_BUSINESS_YEARLY_PRICE_ID=price_ci_biz_y
          export DISABLE_INPROCESS_EMAIL_QUEUE=true
          nohup node dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3001/api/health > /dev/null 2>&1 && break; sleep 2; done
          echo "GET /api/health:";        curl -fsS http://127.0.0.1:3001/api/health; echo
          echo "GET /api/health/ready:";  curl -fsS http://127.0.0.1:3001/api/health/ready; echo

      - name: API smoke test (scripts/smoke/smoke.mjs against the temporary API)
        run: |
          export SMOKE_CLERK_TOKEN="$(cat "$RUNNER_TEMP/smoke_token.txt")"
          node scripts/smoke/smoke.mjs --base-url http://127.0.0.1:3001 | tee "$RUNNER_TEMP/smoke.out"
          grep -q "13/13 steps passed" "$RUNNER_TEMP/smoke.out"

      - name: Diagnostics on failure (logs contain no secrets)
        if: failure()
        run: |
          echo "--- api.log (last 80 lines)";   tail -n 80 "$RUNNER_TEMP/api.log" 2>/dev/null || true
          echo "--- proxy.log";                 tail -n 20 "$RUNNER_TEMP/proxy.log" 2>/dev/null || true
          echo "--- postgrest log";             docker logs pgrst 2>&1 | tail -n 40 || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Database and API verification"
            echo "- Fresh chain (base schema + 002-031 + email automation): see step result"
            echo "- Original 016 halts a fresh database: see step result"
            echo "- Migration 031 upgrade path (additive, idempotent, no data change): see step result"
            echo "- API health, readiness and smoke test: see step result"
            echo "- Commit tested: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: P1 verification gate
    if: always()
    needs: [backend, frontend, database-and-api]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} database-and-api=${{ needs['database-and-api'].result }}"
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs['database-and-api'].result }}" = success
